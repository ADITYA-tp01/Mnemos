version: "3.9"

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: mnemos-falkordb
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - falkordb-data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mnemos-backend
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      PYTHONUNBUFFERED: "1"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: mnemos-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000

volumes:
  falkordb-data: